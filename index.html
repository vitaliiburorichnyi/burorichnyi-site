<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Vitalii Burorichnyi - AI automation portfolio</title>
  <meta name="description" content="An interactive map of AI automation systems built for support, sales and operations: the problems they solve, what was built, and the capabilities underneath.">
  <meta name="color-scheme" content="dark light">
  <link rel="icon" href="avatar.png" type="image/png">
  <link rel="apple-touch-icon" href="avatar.png">

  <!-- Runs before the stylesheet paints, so the chosen theme is already on
       <html> and the page never flashes the wrong one. Kept inline and tiny on
       purpose: an external file would be a second blocking request. -->
  <script>
    (function () {
      var stored = null;
      try { stored = localStorage.getItem("theme"); } catch (e) { /* file:// or blocked */ }
      var theme = (stored === "light" || stored === "dark") ? stored
        : (window.matchMedia && window.matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark");
      document.documentElement.setAttribute("data-theme", theme);
    })();
  </script>

  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <a class="skip-link" href="#map">Skip to the map</a>

  <header class="site-header">
    <div class="identity">
      <!-- Doubles as the way back to the start panel. The image itself is
           decorative, since the name sits right beside it, so alt is empty and
           the button carries the accessible label. -->
      <button id="clear-home" class="identity__home" type="button"
              aria-label="Clear selection" title="Clear selection">
        <img class="identity__avatar" src="avatar.png" alt="" width="56" height="56">
      </button>
      <h1 class="identity__name">Vitalii Burorichnyi</h1>
    </div>

    <div class="header-actions">
      <nav class="tours" id="tours" aria-label="Guided tours"></nav>

      <button id="theme-toggle" class="icon-btn" type="button" aria-label="Switch to light theme">
        <svg class="icon icon--sun" viewBox="0 0 24 24" width="18" height="18" fill="none"
             stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true">
          <circle cx="12" cy="12" r="4.2"/>
          <path d="M12 2.6v2.1M12 19.3v2.1M2.6 12h2.1M19.3 12h2.1M5.2 5.2l1.5 1.5M17.3 17.3l1.5 1.5M18.8 5.2l-1.5 1.5M6.7 17.3l-1.5 1.5"/>
        </svg>
        <svg class="icon icon--moon" viewBox="0 0 24 24" width="18" height="18" fill="none"
             stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M20.1 14.3A8.2 8.2 0 0 1 9.7 3.9a8.6 8.6 0 1 0 10.4 10.4Z"/>
        </svg>
      </button>
    </div>

    <p class="identity__tagline">I build AI systems that remove manual work from support, sales and operations - and I measure whether they did.</p>
  </header>

  <main class="layout">

    <div class="map" id="map">
      <!-- Bands are rendered from data.js by app.js -->
    </div>

    <aside class="panel" id="panel" aria-live="polite" aria-label="Detail panel">
      <!-- Panel contents are rendered by app.js -->
    </aside>

  </main>

  <footer class="site-footer">
    <nav class="site-footer__links" aria-label="Contact">
      <a id="footer-email" href="#">Email</a>
      <a id="footer-linkedin" href="#" target="_blank" rel="noopener">LinkedIn</a>
      <a id="footer-github" href="#" target="_blank" rel="noopener">GitHub</a>
    </nav>
    <p class="site-footer__note">Published cases, each with the result it produced.</p>
  </footer>

  <script src="data.js"></script>
  <script src="app.js"></script>
</body>
</html>
